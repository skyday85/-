[package]
name = "main-agent-unified-app"
version = "0.1.0"
description = "Unified Main Agent application for macOS and iOS"
authors = ["Organization"]
edition = "2021"

[lib]
name = "main_agent_unified_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
